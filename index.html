<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>MiseVerse</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="auth" class="wrap">
<h1><span>Mise</span><br>Verse</h1>
<div class="card">
<div class="tabs"><button id="ti" aria-pressed="true">Masuk</button><button id="tu" aria-pressed="false">Daftar</button></div>
<label for="un">Nama</label><input id="un" type="text" autocomplete="username" maxlength="24">
<label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
<div id="ae" class="err" role="alert"></div>
<button id="go" class="b full">Masuk</button>
<div class="or">atau</div>
<button id="gg" class="g full">Masuk dengan Google</button>
</div></div>

<div id="app" hidden>
<header><button id="mn" class="w">Menu</button><b>MiseVerse</b><span id="dt" class="dot on"></span></header>
<div id="ov"></div>
<div class="lay">
<aside id="side">
<div class="row" id="meb"></div>
<button id="mp" class="b full" style="margin:12px 0 8px">Profil saya</button>
<button id="lo" class="w full s" style="margin-bottom:18px">Keluar</button>
<h2>Orang</h2><ul id="pl"></ul>
</aside>
<main id="main"></main>
</div></div>

<div id="md"><div class="box"><h2 id="mt"></h2><div id="mb"></div><div class="row" id="mx" style="margin-top:14px"></div></div></div>
<div id="toast" role="status"></div>
<input id="pk" type="file" multiple hidden>
<script type="module" src="app.js"></script>
</body></html>
